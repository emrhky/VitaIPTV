# Builds VitaIPTV.vpk on GitHub (Actions tab). Runs on every push to the "test" branch, and by hand
# ("Run workflow"). The VPK is attached to the run as an artifact (VitaIPTV-vpk).
name: Build VPK

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest       # VitaSDK with vita2d and the other vdpm packages
    steps:
      - name: Tools
        run: |
          # (the image was Alpine before, Debian / Ubuntu now: either works)
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make cmake curl xz tar python3 git
          elif command -v apt-get >/dev/null 2>&1; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            $SUDO apt-get update
            DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y --no-install-recommends bash make cmake curl xz-utils tar python3 git ca-certificates
          fi
          echo "VITASDK=${VITASDK:-unset}"; ls "${VITASDK:-/usr/local/vitasdk}/bin" | head -3

      - uses: actions/checkout@v4

      - name: FFmpeg cache (sound decoders, MPEG-2 / MPEG-4 video)
        id: ffcache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-vita
          key: ffmpeg-vita-7.1-neon-${{ hashFiles('tools/build_ffmpeg_vita.sh') }}

      - name: Build FFmpeg (only the decoders the app uses)
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          chmod +x tools/build_ffmpeg_vita.sh
          ./tools/build_ffmpeg_vita.sh

      - name: libjpeg-turbo cache (NEON, posters)
        id: jpegcache
        uses: actions/cache@v4
        with:
          path: third_party/libjpeg-vita
          key: libjpeg-vita-3.2.1-neon-${{ hashFiles('tools/build_libjpeg_vita.sh') }}

      - name: Build libjpeg-turbo with NEON (1.2.4i; if it fails the app uses VitaSDK's libjpeg)
        if: steps.jpegcache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          chmod +x tools/build_libjpeg_vita.sh
          ./tools/build_libjpeg_vita.sh || { rm -rf third_party/libjpeg-vita; exit 1; }

      - name: Build the app
        shell: bash
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          rm -rf build && mkdir build && cd build
          cmake .. | tee cmake.log
          grep -q "AC-3 / E-AC-3: FFmpeg" cmake.log || { echo "FFmpeg was not found: no AC-3 sound"; exit 1; }
          grep -q "AAC 5.1 / 7.1: FFmpeg" cmake.log || { echo "FFmpeg has no AAC decoder: no 5.1 AAC sound"; exit 1; }
          grep -q "Opus / Vorbis: FFmpeg" cmake.log || { echo "FFmpeg has no Opus / Vorbis decoders"; exit 1; }
          grep -q "DTS: FFmpeg" cmake.log || { echo "FFmpeg has no DTS decoder"; exit 1; }
          grep -q "MPEG-2 / MPEG-4 video: FFmpeg" cmake.log || { echo "FFmpeg has no MPEG-2 / MPEG-4 video decoders"; exit 1; }
          make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: VitaIPTV-vpk
          path: build/VitaIPTV.vpk

  # 1.2.2: the PC tests (tests/run_all.py), next to the build: a failing test does not stop the VPK
  tests:
    # 1.2.4l: "ubuntu-latest" became Ubuntu 26.04 in November 2026 (FFmpeg 8 without the AAC Main encoder, newer
    # OpenSSL / gcc): the tests stay on the image they were written and passed on
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc make curl xz-utils ffmpeg openssl \
            zlib1g-dev libjpeg-dev libpng-dev python3-pil python3-opencv

      - name: FFmpeg cache (PC, for the sound decoding tests)
        id: ffpc
        uses: actions/cache@v4
        with:
          path: ~/ffpc
          key: ffmpeg-pc-${{ hashFiles('tools/build_ffmpeg_pc.sh') }}

      - name: Build FFmpeg (PC)
        if: steps.ffpc.outputs.cache-hit != 'true'
        run: |
          chmod +x tools/build_ffmpeg_pc.sh
          ./tools/build_ffmpeg_pc.sh "$HOME/ffpc"

      - name: Run the tests
        run: FFMPEG_PREFIX="$HOME/ffpc" python3 tests/run_all.py
