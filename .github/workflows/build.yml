# Builds VitaIPTV.vpk on GitHub (Actions tab). Runs on every push to the "test" branch, and by hand
# ("Run workflow"). The VPK is attached to the run as an artifact (VitaIPTV-vpk).
name: Build VPK

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest       # VitaSDK with vita2d and the other vdpm packages
    steps:
      - name: Tools
        run: |
          # (the image was Alpine before, Debian / Ubuntu now: either works)
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make cmake curl xz tar python3 git
          elif command -v apt-get >/dev/null 2>&1; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            $SUDO apt-get update
            DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y --no-install-recommends bash make cmake curl xz-utils tar python3 git ca-certificates
          fi
          echo "VITASDK=${VITASDK:-unset}"; ls "${VITASDK:-/usr/local/vitasdk}/bin" | head -3

      - uses: actions/checkout@v4

      - name: FFmpeg cache (AC-3 / E-AC-3 / AAC)
        id: ffcache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-vita
          key: ffmpeg-vita-7.1-${{ hashFiles('tools/build_ffmpeg_vita.sh') }}

      - name: Build FFmpeg (AC-3 / E-AC-3 / AAC decoders only)
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          chmod +x tools/build_ffmpeg_vita.sh
          ./tools/build_ffmpeg_vita.sh

      - name: Build the app
        shell: bash
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          rm -rf build && mkdir build && cd build
          cmake .. | tee cmake.log
          grep -q "AC-3 / E-AC-3: FFmpeg" cmake.log || { echo "FFmpeg was not found: no AC-3 sound"; exit 1; }
          grep -q "AAC 5.1 / 7.1: FFmpeg" cmake.log || { echo "FFmpeg has no AAC decoder: no 5.1 AAC sound"; exit 1; }
          make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: VitaIPTV-vpk
          path: build/VitaIPTV.vpk
